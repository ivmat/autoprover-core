# acceptance.toml — a MINIMAL, hand-authored acceptance/0 manifest for autoprover-core.
#
# WHAT THIS FILE IS: a hand-built certificate over four REPO-LEVEL, mechanically-checked facts
# about this repository's own tooling — the corpus package builds under its pinned toolchain, the
# corpus's own navigational/honesty catalog is internally consistent, the reference implementation's
# test suite passes, and the catalog's honesty-flag check (scoped rows must state their restriction)
# is itself machine-enforced. Each claim below is checked by re-running the exact command printed on
# it, against this checkout, by anyone — that re-run, not this file's own say-so, is what a reader
# should trust (the same escape from self-reference acceptance-format's own SELF-NOTE names). Every
# watched-fail witness below additionally has its own transcript file under evidence/, carrying a
# PERTURBATION header (what was changed, as a diff), the exact command, and the exit status ahead of
# the real output — independently readable without the prose in this file.
#
# WHAT THIS FILE DELIBERATELY IS NOT:
#   - It is NOT a claim about what any Lean theorem in corpus/ proves. Every claim below is scoped
#     to packaging/tooling facts (does it build, is the index honest, do the reference tests pass) —
#     never to a theorem's statement, its hypotheses, or its mathematical content. corpus/CATALOG.md
#     and the theorem files themselves remain the authority on what is actually proved.
#   - It is NOT the ADR-005 flagship bundle. docs/decisions/ADR-005-manifest-is-generated-from-
#     receipts.md rules that any projection of this repository's RECEIPTS (its kernel/audit
#     verdicts, one row per claim_id) into an acceptance manifest must be GENERATED by a tool that
#     reads the receipt store, never hand-authored — because a hand-written row's evidentiary
#     content would be prose wearing a table's shape. This file contains zero such rows: it makes no
#     claim traceable to a receipt, and ADR-005 does not govern it for exactly that reason (there is
#     nothing here for it to govern — no receipt-derived evidentiary content exists in this file).
#   - This manifest is written under format.md's own allowance for hand-authored manifests
#     ([format].generated_by = "hand-authored", below) for a DIFFERENT, repo-level object than the
#     one ADR-005 reserves. Should an emitter ever be built for the receipt-store projection ADR-005
#     describes, that GENERATED manifest is a different object from this one, at a different path or
#     under a different id — it supersedes nothing here, and this file makes no claim it would
#     collide with.
#
# Self-certification convention (format.md, "[format] self-location"): this manifest lives in the
# repository it certifies, so it cannot name the commit that contains itself. [format].spec_sha /
# [format].validator_sha name the acceptance-format commit this manifest is written against (a
# DIFFERENT, external repository — see the note on [spec], below, for why the "same commit" wording
# in that section does not apply verbatim here). [subject].commit names the clean commit at which
# every evidence transcript below was captured: 305c07feefc12670b911421a12b4bf59df37c65b (the prior
# commit, a documentation-only README update — no evidentiary content). This manifest and its
# evidence/ records land together in the immediately following commit, whose diff is exactly this
# manifest-and-evidence update and nothing else. `dirty = false` describes the NAMED commit, not
# this one.

[format]
id            = "acceptance/0"
shape         = "single-file"
spec_id       = "acceptance-format"
spec_sha      = "bd1c995bd9ae7382d33e3db8c11acc5a99ac3ba4"       # acceptance-format @ bd1c995;
                              # tools/ and spec/ are byte-identical between this commit and the
                              # acceptance-format checkout actually used to validate this file
                              # (`git diff bd1c995 -- tools/ spec/` is empty there), so bd1c995 is
                              # also the validator sha actually exercised, named below.
validator_sha = "bd1c995bd9ae7382d33e3db8c11acc5a99ac3ba4"
generated_by  = "hand-authored"
generated_at  = "2026-08-29T17:23:40Z"
illustrative  = false        # this is a certificate for a real subject, not a teaching example —
                              # it is expected to validate under --strict --strict-weight with no
                              # exemption for scope: MINIMAL scope is a property of what it claims,
                              # not of how strictly it is checked.

[subject]
name   = "autoprover-core"
kind   = "other"             # honest registry token (format.md): this subject is not a Rust crate
                              # or workspace at all — it is a multi-language repository (Lean corpus
                              # + Python reference implementation + docs) with no Rust anywhere in
                              # it. None of the other eight registry tokens fit either (not a single
                              # "doc", not a "tool" in the sense that word is used elsewhere in this
                              # registry, not "ml-model"/"dataset"/"spec"/"design"/"agent-output"),
                              # so "other" is the honest choice, not "rust-workspace" (which would
                              # falsely assert Rust content).
commit = "305c07feefc12670b911421a12b4bf59df37c65b"
dirty  = false                # the named commit's tree was clean when every transcript below was
                              # captured; see the self-certification note above for the one-commit
                              # lag between this commit and the one that lands this file.
repo   = "github.com/ivmat/autoprover-core"
# subject_hash: DELIBERATELY OMITTED. This is a multi-file subject; format.md's `subject:` M11
# domain is ratified but this revision's tooling computes it only for the single-file case
# (the multi-file bundle-root-style inventory hash is PENDING the same P12 canonical-emit work
# `bundle-root` itself defers to). Recording a hand-rolled multi-file hash here would invent the
# exact byte-serialization the spec itself says is not yet fixed.

[spec]
# There is no clause-addressable specification document for "what does this repo's own tooling
# mechanically decide" — the closest thing is README.md §3 ("Building blocks"), which states the
# three recipes (`lake build`, `check_catalog.py`, `run_tests.py`) each claim below re-runs. This is
# NOT docs/ARCHITECTURE.md, docs/INTERFACES.md or any ADR: those define the pipeline PATTERN this
# repo documents, not what this repo's own build/catalog/test tooling currently does — which is what
# every claim below actually checks. Per format.md's coverage comment: "where the subject has no
# clause-addressable specification, clauses_total equals claims_total by construction" — true here,
# stated in [coverage] below rather than left implicit.
path    = "README.md"
version = "305c07feefc12670b911421a12b4bf59df37c65b"   # the same commit [subject].commit names —
                              # README.md §3's text at that commit is what each claim's `item`
                              # below paraphrases.
axis    = "repo-level, mechanically-checked packaging/tooling facts about autoprover-core's own build, catalog-consistency, and test-suite gates (README.md §3) — never a claim about what any Lean theorem in corpus/ proves, and never a projection of any receipt this repo's pipeline pattern would produce (see the top-of-file framing note and ADR-005)"

[coverage]
clauses_total = 4             # no clause-addressable spec exists (see [spec] comment above); the
                              # 4 claims below ARE the axis, by construction.
claims_total  = 4


    date       = "2026-08-29"

  [[claim.evidence]]
  kind        = "lint"
  family      = "mechanical"
  method      = "lint"
  epistemic_tier = "T4"
  ref         = "lake --dir corpus build (77 build jobs over the 74-module corpus)"

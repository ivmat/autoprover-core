  [[claim.evidence]]
  kind        = "lint"
  family      = "mechanical"
  method      = "lint"
  epistemic_tier = "T4"
  ref         = "lake --dir corpus build (mutant: one false theorem appended to AutoproverCorpus/Security/MerkleInclusion.lean, in a scratch copy)"

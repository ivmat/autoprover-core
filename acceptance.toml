# =====================================================================================================

[[claim]]
id        = "AC-1"
clause    = "BUILD"
item      = "corpus/ (lake build)"
statement = "the corpus/ Lean package builds successfully end-to-end under its pinned toolchain (leanprover/lean4:v4.31.0) — a packaging/toolchain fact about the corpus compiling, NOT a claim about what any theorem inside it proves (out of scope for this manifest; see the top-of-file framing note)"
band      = "A1"              # mechanical-family, no-oracle hygiene species (a build either
                              # completes or it does not) — A1 reachable with no control required
                              # (assurance-bands.md row A1 / rule 6), witnessed below.
status    = "evidenced"
weight    = "weighted"
grade     = "mechanical"      # core.md §1's own paradigm case: "a tool decides it with no
                              # behavioural oracle" — here, a build-succeeds/build-fails gate.
clause_source = "doc-comment"  # README.md §3's own line: "Build: `cd corpus && lake build`."

  [claim.self_verify]
  command = "lake --dir corpus build"
  expect  = "Build completed successfully (77 jobs)."

    [claim.self_verify.watched_fail]
    of_command = "lake --dir corpus build"
    perturbed  = "in a scratch copy of corpus/ (the tracked tree was never touched), applied a unified diff appending `theorem __watched_fail_probe__ : 1 = 2 := by rfl` to the end of AutoproverCorpus/Security/MerkleInclusion.lean (verified applyable with `git apply --check` before running), then re-ran the identical command from the scratch copy's parent directory. Transcript (one invocation line elided, disclosed inline), with the exact diff and exit status ahead of the real output: evidence/corpus-lake-build-watched-fail.txt (the second evidence record on this claim, below)."

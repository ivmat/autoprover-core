  record      = "evidence/corpus-lake-build.txt"
  record_hash = "sha-512:f24ccaf07054abdeca25217c9f2077f3f7154f9c502fac7c32826a8a68dd641af0666ea5f87ed944f075a0503153dbd50f9593dd1dd80250dae2f6fcfd52ad14"

  # Disclosure evidence, not itself a band-lift control (mechanical hygiene reaches A1 with none
